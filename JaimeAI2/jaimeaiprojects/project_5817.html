

<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>JaimeAI2 Mini Chaos Site</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0f;
            color: #eee;
            overflow-x: hidden;
        }

        header {
            padding: 1rem 2rem;
            background: #11111a;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .orb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff7bff, #6b00ff);
            box-shadow: 0 0 12px #b300ff;
        }

        .title {
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .status {
            font-size: 0.8rem;
            color: #9aa;
        }

        .container {
            padding: 2rem;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: #14141f;
            border: 1px solid #222;
            border-radius: 0.6rem;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(255,255,255,0.04);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #9cf;
        }

        .terminal {
            background: #0d0d14;
            border: 1px solid #222;
            border-radius: 0.4rem;
            padding: 0.8rem;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            position: relative;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 1em;
            background: #eee;
            animation: blink 1s infinite steps(2, start);
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .btn {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            background: #222236;
            border: 1px solid #333;
            border-radius: 0.4rem;
            color: #9cf;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: 0.15s;
        }

        .btn:hover {
            background: #2d2d4a;
            transform: translateY(-2px);
        }

        .log {
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: #aaa;
        }
    </style>
</head>
<body>

<header>
    <div style='display:flex;align-items:center;gap:0.6rem;'>
        <div class='orb'></div>
        <div class='title'>JaimeAI2</div>
    </div>
    <div class='status'>engine online</div>
</header>

<div class='container'>

    <div class='card'>
        <h2>mini terminal</h2>
        <div class='terminal' id='term'>
            booting JaimeAI2...<br>
            loading modules...<br>
            ready.<br><br>
            jaime@ai2:~$ <span id='input'>_</span><span class='cursor'></span>
        </div>
        <div class='btn' onclick='addLog()'>run random command</div>
    </div>

    <div class='card'>
        <h2>stats</h2>
        <div class='log' id='stats'>
            projects spawned: 0<br>
            who-chants blocked: 0<br>
            chaos level: 7/10<br>
        </div>
    </div>

</div>

<script>
    let projects = 0;
    let whos = 0;

    function addLog() {
        const term = document.getElementById('term');
        const stats = document.getElementById('stats');

        const lines = [
            'thinking...',
            'running internal chaos engine...',
            'compiling gremlin thoughts...',
            'error: too much who who who',
            'generating project...',
            'evaluating 2+2...',
            'parsing unknown command...',
            'activating sarcasm module...'
        ];

        const pick = lines[Math.floor(Math.random() * lines.length)];

        term.innerHTML += 'jaime@ai2:~$ ' + pick + '<br>';

        if (pick.includes('project')) projects++;
        if (pick.includes('who')) whos++;

        stats.innerHTML =
            'projects spawned: ' + projects + '<br>' +
            'who-chants blocked: ' + whos + '<br>' +
            'chaos level: ' + (7 + Math.floor(Math.random()*4)) + '/10<br>';
    }
</script>

</body>
</html>
